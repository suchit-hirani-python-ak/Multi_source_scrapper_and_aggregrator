services:
  redis:
    image: redis:alpine
    ports:
      - "6380:6379"

  app:
    build: .
    container_name: app
    volumes:
      - .:/app
    ports:
      - "8001:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - redis

  celery_worker:
    build: .
    container_name: celery_worker
    command: uv run celery -A app.utils.celery worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=.
    depends_on:
      - redis

  flower:
    build: .
    container_name: flower
    command: uv run celery -A app.utils.celery flower --port=5555
    ports:
      - "5556:5555"
    volumes:
      - .:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=.